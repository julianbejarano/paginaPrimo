<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f0eb; color: #1a1208; margin: 0; padding: 2rem; }
      #panel-cuenta { max-width: 480px; margin: 0 auto; }
      h2 { margin-bottom: 0.5rem; }
      #estado-sesion { margin-bottom: 1.5rem; color: #6a655b; }
      form { background: #fffcf8; border: 1px solid #e0d8ce; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
      form h3 { margin: 0 0 1rem; }
      label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 0.75rem; }
      input { display: block; width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid #e0d8ce; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; }
      button { margin-top: 1rem; padding: 10px 20px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
      form button[type="submit"] { background: #1a1208; color: white; }
      form button[type="submit"]:hover { background: #c8522a; }
      #btn-logout { background: #c8522a; color: white; }
      #btn-logout:hover { background: #a8401e; }

      .perfil-card { background: #fffcf8; border: 1px solid #e0d8ce; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
      .perfil-card h3 { margin: 0 0 1rem; }
      .perfil-tabla { width: 100%; border-collapse: collapse; }
      .perfil-tabla th { text-align: left; padding: 8px 12px 8px 0; font-size: 0.85rem; color: #6a655b; border-bottom: 1px solid #e0d8ce; width: 100px; }
      .perfil-tabla td { padding: 8px 0; font-size: 0.95rem; border-bottom: 1px solid #e0d8ce; }

      /* Navbar */
      .navbar { background: #1a1208; color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
      .navbar h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
      .navbar-acciones { display: flex; align-items: center; gap: 8px; }
      .nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.6); font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 6px 14px; border-radius: 50px; transition: all 0.2s; box-shadow: none; margin: 0; }
      .nav-tab:hover { color: white; background: rgba(255,255,255,0.1); box-shadow: none; transform: none; }
      .nav-tab.activo { color: white; background: rgba(255,255,255,0.2); }
      .btn-gear { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: background 0.2s; box-shadow: none; margin: 0; }
      .btn-gear:hover { background: rgba(255,255,255,0.15); box-shadow: none; transform: none; }

      /* Carrito boton navbar */
      .btn-carrito { display: flex; align-items: center; gap: 6px; background: #c8522a; color: white; border: none; padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; cursor: pointer; box-shadow: none; margin: 0; }
      .btn-carrito:hover { background: #a8401e; box-shadow: none; transform: none; }
      #contador-badge { background: white; color: #c8522a; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }

      /* Tienda */
      #zona-tienda { max-width: 960px; margin: 0 auto; padding: 1.5rem; display: none; }
      #estado-carga-tienda { text-align: center; padding: 2rem 0; color: #6a655b; }
      .galeria-tienda { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

      /* Cards producto */
      .card-tienda { background: #fffcf8; border: 1px solid #e0d8ce; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(26,18,8,0.07); transition: transform 0.2s, box-shadow 0.2s; }
      .card-tienda:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(26,18,8,0.12); }
      .card-tienda .card-img { width: 100%; height: 180px; object-fit: cover; display: block; }
      .card-tienda .card-img-vacia { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; background: #e0d8ce; color: #6a655b; font-size: 0.85rem; }
      .card-tienda .card-body { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .card-tienda .card-nombre { font-weight: 600; font-size: 1rem; margin: 0; }
      .card-tienda .card-descripcion { font-size: 0.82rem; color: #6a655b; margin: 0; flex: 1; }
      .card-tienda .card-precio { font-size: 1.2rem; font-weight: 700; color: #c8522a; margin: 0; }
      .card-tienda .card-precio-original { font-size: 0.82rem; color: #6a655b; text-decoration: line-through; }
      .card-tienda .card-descuento { font-size: 0.72rem; background: #c8522a; color: white; padding: 2px 7px; border-radius: 50px; margin-left: 4px; }
      .card-tienda .card-estado { font-size: 0.78rem; color: #4a7c59; margin: 0; }
      .card-tienda .card-estado.agotado { color: #c8522a; }

      /* Acciones card: +/- y Agregar */
      .card-tienda .card-acciones { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #e0d8ce; }
      .btn-qty { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #e0d8ce; background: #f5f0eb; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; margin: 0; box-shadow: none; color: #1a1208; }
      .btn-qty:hover { box-shadow: none; transform: none; }
      .btn-qty.restar:hover { background: #fde4da; border-color: #c8522a; color: #c8522a; }
      .btn-qty.sumar:hover { background: #d7ede0; border-color: #4a7c59; color: #4a7c59; }
      .cantidad-display { font-size: 0.9rem; font-weight: 700; min-width: 24px; text-align: center; }
      .btn-agregar { margin-left: auto; background: #1a1208; color: white; border: none; padding: 6px 14px; border-radius: 50px; font-size: 0.82rem; font-weight: 600; cursor: pointer; box-shadow: none; margin-top: 0; }
      .btn-agregar:hover { background: #c8522a; box-shadow: none; transform: none; }
      .btn-agregar:disabled { opacity: 0.4; cursor: not-allowed; }

      /* Panel carrito */
      #panel-carrito { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: #fffcf8; box-shadow: -6px 0 30px rgba(26,18,8,0.12); z-index: 200; display: flex; flex-direction: column; transition: right 0.3s ease; }
      #panel-carrito.abierto { right: 0; }
      .carrito-header { padding: 18px 20px; border-bottom: 1px solid #e0d8ce; display: flex; justify-content: space-between; align-items: center; background: #1a1208; color: white; }
      .carrito-header h3 { margin: 0; font-size: 1rem; }
      #btn-cerrar-carrito { background: none; border: none; color: white; font-size: 1.3rem; cursor: pointer; padding: 0; box-shadow: none; margin: 0; }
      #btn-cerrar-carrito:hover { box-shadow: none; transform: none; }
      #lista-carrito { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .item-carrito { display: flex; gap: 10px; align-items: center; background: #f5f0eb; border-radius: 10px; padding: 10px; border: 1px solid #e0d8ce; }
      .item-carrito img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
      .item-info { flex: 1; }
      .item-info strong { font-size: 0.85rem; display: block; }
      .item-info span { font-size: 0.78rem; color: #6a655b; }
      .item-subtotal { font-weight: 700; color: #c8522a; font-size: 0.9rem; }
      .carrito-vacio { text-align: center; color: #6a655b; padding: 3rem; margin: 0; }
      .carrito-footer { padding: 16px 20px; border-top: 1px solid #e0d8ce; }
      .total-row { display: flex; justify-content: space-between; align-items: center; }
      .total-row span:last-child { font-size: 1.3rem; font-weight: 700; color: #c8522a; }
      #overlay-carrito { display: none; position: fixed; inset: 0; background: rgba(26,18,8,0.3); z-index: 150; backdrop-filter: blur(2px); }
      #overlay-carrito.activo { display: block; }

      @media (max-width: 600px) {
        .navbar { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
        .navbar-acciones { width: 100%; justify-content: flex-end; }
        #zona-tienda { padding: 1rem; }
        #panel-carrito { width: 100%; right: -100%; }
      }

      /* Panel de edición */
      #zona-editar { display: none; }
      #zona-editar form { background: #fffcf8; border: 1px solid #e0d8ce; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
      #zona-editar h3 { margin: 0 0 1rem; }
      .acciones-editar { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
      .acciones-editar button { flex: 1; }
      .btn-cancelar { background: #e0d8ce; color: #1a1208; }
      .btn-cancelar:hover { background: #cfc7bc; }
      #msg-editar { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.2em; }
      .msg-ok { color: #4a7c59; }
      .msg-err { color: #c8522a; }
    </style>
  </head>
  <body>
    <!-- Navbar: visible solo con sesión activa -->
    <nav class="navbar" id="navbar" style="display:none;">
      <h1>Mi cuenta</h1>
      <div class="navbar-acciones">
        <button class="nav-tab activo" type="button" data-seccion="perfil">Perfil</button>
        <button class="nav-tab" type="button" data-seccion="tienda">Productos</button>
        <button class="btn-gear" id="btn-gear" type="button" title="Editar perfil">&#9881;</button>
        <button class="btn-carrito" id="btn-carrito" type="button" style="display:none;">Carrito <span id="contador-badge">0</span></button>
      </div>
    </nav>

    <section id="panel-cuenta">
      <h2 id="titulo-cuenta">Mi cuenta</h2>
      <p id="estado-sesion">No has iniciado sesión.</p>

      <!-- Formularios: visibles solo cuando NO hay sesión -->
      <div id="zona-formularios">
        <form id="form-registro">
          <h3>Registrarme</h3>
          <label for="registro-nombre">Nombre</label>
          <input id="registro-nombre" type="text" required />

          <label for="registro-correo">Correo</label>
          <input id="registro-correo" type="email" required />

          <label for="registro-telefono">Teléfono</label>
          <input id="registro-telefono" type="tel" />

          <label for="registro-ciudad">Ciudad</label>
          <input id="registro-ciudad" type="text" />

          <label for="registro-direccion">Dirección</label>
          <input id="registro-direccion" type="text" />

          <label for="registro-password">Contraseña</label>
          <input id="registro-password" type="password" minlength="6" required />

          <button type="submit">Crear cuenta</button>
        </form>

        <form id="form-login">
          <h3>Iniciar sesión</h3>
          <label for="login-correo">Correo</label>
          <input id="login-correo" type="email" required />

          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" required />

          <button type="submit">Iniciar sesión</button>
        </form>
      </div>

      <!-- Ficha de perfil: visible solo cuando HAY sesión -->
      <div id="zona-perfil" style="display:none;">
        <div class="perfil-card">
          <h3>Datos del cliente</h3>
          <table class="perfil-tabla">
            <tr><th>Nombre</th><td id="perfil-nombre">—</td></tr>
            <tr><th>Correo</th><td id="perfil-correo">—</td></tr>
            <tr><th>Teléfono</th><td id="perfil-telefono">—</td></tr>
            <tr><th>Ciudad</th><td id="perfil-ciudad">—</td></tr>
            <tr><th>Dirección</th><td id="perfil-direccion">—</td></tr>
          </table>
        </div>
        <!-- Formulario de edición: se muestra al hacer clic en el gear -->
        <div id="zona-editar">
          <form id="form-editar">
            <h3>Editar datos</h3>

            <label for="editar-nombre">Nombre</label>
            <input id="editar-nombre" type="text" required />

            <label for="editar-telefono">Teléfono</label>
            <input id="editar-telefono" type="tel" />

            <label for="editar-ciudad">Ciudad</label>
            <input id="editar-ciudad" type="text" />

            <label for="editar-direccion">Dirección</label>
            <input id="editar-direccion" type="text" />

            <p id="msg-editar"></p>

            <div class="acciones-editar">
              <button type="submit">Guardar cambios</button>
              <button type="button" class="btn-cancelar" id="btn-cancelar-editar">Cancelar</button>
            </div>
          </form>
        </div>

        <button id="btn-logout" type="button">Cerrar sesión</button>
      </div>
    </section>

    <!-- Tienda: galería de productos con carrito -->
    <section id="zona-tienda">
      <p id="estado-carga-tienda">Cargando productos...</p>
      <div id="galeria-tienda" class="galeria-tienda"></div>
    </section>

    <!-- Overlay + panel carrito deslizable -->
    <div id="overlay-carrito"></div>
    <div id="panel-carrito">
      <div class="carrito-header">
        <h3>Tu Carrito</h3>
        <button id="btn-cerrar-carrito" type="button">&#10005;</button>
      </div>
      <div id="lista-carrito">
        <p class="carrito-vacio">Tu carrito esta vacio</p>
      </div>
      <div class="carrito-footer">
        <div class="total-row">
          <span>Total</span>
          <span id="total-valor">$0</span>
        </div>
      </div>
    </div>

    <script src="js/supabaseClient.js"></script>
    <script src="js/cliente.js"></script>
  </body>
</html>
